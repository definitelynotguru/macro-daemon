[package]
name = "macro-e2e"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "End-to-end hold-timing proof: authors a hold-400ms macro and measures what the real engine paces"
license = "MIT"
publish = false

[lib]
name = "macro_e2e"
path = "src/lib.rs"

[[bin]]
name = "macro-e2e"
path = "src/main.rs"

[dependencies]
macro_daemon = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"
