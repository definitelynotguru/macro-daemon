[workspace]
members = [".", "e2e", "app"]
resolver = "2"

[package]
name = "macro_daemon"
version = "0.1.1"
edition = "2021"
description = "Vendor-neutral macro daemon: replays recovered macro semantics via Linux evdev/uinput"
license = "MIT"

[lib]
name = "macro_daemon"
path = "src/lib.rs"

[[bin]]
name = "macro-daemon"
path = "src/main.rs"

[[bin]]
name = "macro-mcp"
path = "mcp/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uinput = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false

# Rune's Windows target asks parley_engine 0.12 for `line-dictionaries`.
# crates.io 0.12.0 does not publish that feature, and Cargo resolves it on Linux too.
# The patch is the published crate plus an empty feature so the git pin resolves.
[patch.crates-io]
parley_engine = { path = "patches/parley_engine" }
